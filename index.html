  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:Georgia, 'Times New Roman', serif;
     background:linear-gradient(135deg,#fff8f5,#f7e8e8 50%,#f5efe5); color:var(--brown); }
  .wrap { max-width:680px; margin:auto; padding:28px 18px 40px; }
  .card { background:#fffdf8; border:1px solid rgba(201,162,39,.55); border-radius:22px;
       box-shadow:0 18px 45px rgba(74,42,32,.16); padding:32px 24px; text-align:center; }
  .kicker { letter-spacing:.22em; text-transform:uppercase; color:#b58b3a; font-size:15px; font-weight:bold; margin-bottom:8px; }
 h1 { margin:10px 0 6px; font-size:38px; color:var(--brown); }
 p { color:#5b514b; font-size:19px; line-height:1.5; }
  input { width:100%; padding:18px 20px; border:2px solid #d8cbb9; border-radius:16px;
           font-size:17px; outline:none; }
  input:focus { border-color:var(--gold); }
  button { margin-top:12px; width:100%; padding:17px; border:0; border-radius:16px; font-size:20px; font-weight:bold; letter-spacing:.04em; cursor:pointer; box-shadow:0 8px 20px rgba(74,42,32,.18);
            background:var(--blue); color:white; font-size:17px; font-weight:700; cursor:pointer; }
 #results { margin-top:20px; text-align:left; font-size:28px; line-height:1.5; }
 .result { background:#fff; border-left:6px solid var(--gold); border-radius:14px; font-size:22px; }
             padding:17px; margin:10px 0; box-shadow:0 5px 16px rgba(0,0,0,.07); }
  .name { font-size:20px; font-weight:700; }
  .table { font-size:28px; color:var(--blue); font-weight:700; margin-top:6px; }
  .seat { color:#5b514b; margin-top:3px; }
  .note { font-size:12px; margin-top:22px; color:#766c65; }
</style>

function findSeat() {
  const name = document.getElementById("guestName").value.trim();
  const result = document.getElementById("result");

  if (guests[name]) {
   result.innerHTML = `You are seated at <strong style="font-size:32px;">Table ${guests[name].table}</strong>, <strong style="font-size:32px;">Seat ${guests[name].seat}</strong>.`;
  } else {
    result.innerHTML = "Name not found. Please check the spelling and try again.";
  }
}
