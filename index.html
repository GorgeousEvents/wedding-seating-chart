<meta charset="utf-8">

<title>Find Your Seat</title>

<style>
:root {
  --brown: #4a2a20;
  --blue: #1e3a5f;
  --gold: #c9a227;
  --ivory: #fffaf0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  background: linear-gradient(135deg, #fffaf0, #f4eee5 50%, #e9edf3);
  color: var(--brown);
}

.couple-photo {
  display: block;
  width: 100%;
  max-width: 500px;
  height: auto;
  margin: 28px auto 0;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(74, 42, 32, 0.20);
}

.wrap {
  max-width: 680px;
  margin: auto;
  padding: 24px 18px 40px;
}

.card {
  background: #fffdf8;
  border: 1px solid rgba(201, 162, 39, 0.65);
  border-radius: 22px;
  box-shadow: 0 18px 45px rgba(74, 42, 32, 0.16);
  padding: 38px 28px;
  text-align: center;
}

.kicker {
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #b58b3a;
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 8px;
}

h1 {
  margin: 10px 0 8px;
  font-size: 44px;
  color: var(--brown);
  font-weight: normal;
  letter-spacing: 0.02em;
}

p {
  color: #5b514b;
  font-size: 20px;
  line-height: 1.6;
  margin: 10px 0 24px;
}

input {
  width: 100%;
  padding: 19px 20px;
  border: 2px solid #d8cbb9;
  border-radius: 16px;
  font-size: 20px;
  outline: none;
  text-align: center;
  background: #fff;
}

input:focus {
  border-color: var(--gold);
}

button {
  margin-top: 14px;
  width: 100%;
  padding: 18px;
  border: 0;
  border-radius: 16px;
  background: var(--blue);
  color: white;
  font-size: 21px;
  font-weight: bold;
  letter-spacing: 0.05em;
  cursor: pointer;
  box-shadow: 0 8px 22px rgba(74, 42, 32, 0.20);
}

button:hover {
  opacity: 0.92;
}

#result {
  margin-top: 20px;
  text-align: left;
  font-size: 28px;
  line-height: 1.5;
}

.result {
  background: #fff;
  border-left: 6px solid var(--gold);
  border-radius: 14px;
  font-size: 22px;
  padding: 17px;
  margin: 10px 0;
  box-shadow: 0 5px 16px rgba(0, 0, 0, 0.07);
}

.name {
  font-size: 20px;
  font-weight: 700;
}

.table {
  font-size: 28px;
  color: var(--blue);
  font-weight: 700;
  margin-top: 6px;
}

.seat {
  color: #5b514b;
  margin-top: 3px;
}

.note {
  font-size: 12px;
  margin-top: 22px;
  color: #766c65;
}

@media (max-width: 600px) {
  .couple-photo {
    margin-top: 15px;
    border-radius: 14px;
  }

  .card {
    padding: 30px 20px;
  }

  h1 {
    font-size: 36px;
  }

  p {
    font-size: 18px;
  }
}
</style>
