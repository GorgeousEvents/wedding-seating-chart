  :root { --brown:#4a2a20; --blue:#1e3a5f; --gold:#c9a227; --ivory:#fffaf0; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:Georgia, 'Times New Roman', serif;
         background:linear-gradient(145deg,var(--ivory),#f5eee2); color:var(--brown); }
  .wrap { max-width:680px; margin:auto; padding:28px 18px 40px; }
  .card { background:#fffdf8; border:1px solid rgba(201,162,39,.55); border-radius:22px;
           box-shadow:0 12px 35px rgba(74,42,32,.12); padding:28px 22px; text-align:center; }
  .kicker { letter-spacing:.18em; text-transform:uppercase; color:var(--blue); font-size:12px; }
  h1 { margin:10px 0 6px; font-size:34px; color:var(--brown); }
  p { color:#5b514b; }
  input { width:100%; padding:16px 18px; border:2px solid #d8cbb9; border-radius:14px;
           font-size:17px; outline:none; }
  input:focus { border-color:var(--gold); }
  button { margin-top:12px; width:100%; padding:15px; border:0; border-radius:14px;
            background:var(--blue); color:white; font-size:17px; font-weight:700; cursor:pointer; }
  #results { margin-top:20px; text-align:left; }
  .result { background:#fff; border-left:6px solid var(--gold); border-radius:14px;
             padding:17px; margin:10px 0; box-shadow:0 5px 16px rgba(0,0,0,.07); }
  .name { font-size:20px; font-weight:700; }
  .table { font-size:28px; color:var(--blue); font-weight:700; margin-top:6px; }
  .seat { color:#5b514b; margin-top:3px; }
  .note { font-size:12px; margin-top:22px; color:#766c65; }
</style>

function norm(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
}
function findGuest() {
  const q = norm(document.getElementById("q").value);
  const box = document.getElementById("results");
  if (!q) { box.innerHTML = "<p>Please enter your name.</p>"; return; }
  const matches = guests.filter(g => norm(g.name).includes(q));
  if (!matches.length) {
    box.innerHTML = "<p><strong>We couldn't find that name.</strong><br>Please check the spelling or see the wedding attendant.</p>";
    return;
  }
  box.innerHTML = matches.slice(0,10).map(g =>
    `<div class="result"><div class="name">${g.name}</div>
     <div class="table">Table ${g.table}</div>
     <div class="seat">Seat ${g.seat}</div></div>`
  ).join("");
}
document.getElementById("q").addEventListener("keydown", e => {
